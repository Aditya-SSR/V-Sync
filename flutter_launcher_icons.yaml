flutter_launcher_icons:
  android: true
  ios: true
  # Legacy fallback (Android < 8): white V on near-black, so it reads on
  # any launcher background.
  image_path: "assets/images/logo/app_icon_legacy.png"
  image_path_android: "assets/images/logo/app_icon_legacy.png"
  background_color_ios: "#0A0A0A"
  # Adaptive icon (Android 8+). Light theme: white bg + black V.
  # Dark theme uses drawable-night-* (white V) with the night background
  # color #0A0A0A defined in values-night/colors.xml.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/foreground_black.png"
  adaptive_icon_monochrome: "assets/images/logo/monochrome.png"
  remove_alpha_ios: true
